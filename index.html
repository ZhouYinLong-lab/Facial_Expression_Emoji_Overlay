<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="在浏览器本地识别人脸与表情，用 Emoji 自动遮住合影中的人脸并导出 PNG。"
    />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Emoji Mask — 表情人脸贴图</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="./" aria-label="Emoji Mask 首页">
          <span class="brand-mark" aria-hidden="true">
            <img src="./assets/favicon.png" alt="" />
          </span>
          <span class="brand-copy">
            <strong>Emoji Mask</strong>
            <small>表情人脸贴图</small>
          </span>
        </a>
        <div class="header-meta">
          <span class="privacy-chip">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 5 6v5c0 4.6 2.9 8.1 7 10 4.1-1.9 7-5.4 7-10V6l-7-3Z" />
              <path d="m9.5 12 1.7 1.7 3.6-4" />
            </svg>
            图片仅在本地处理
          </span>
          <a
            class="github-link"
            href="https://github.com/ZhouYinLong-lab/Facial_Expression_Emoji_Overlay"
            target="_blank"
            rel="noreferrer"
            aria-label="在 GitHub 查看源代码（新窗口）"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.87c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.84a9.6 9.6 0 0 1 2.5.34c1.9-1.29 2.74-1.02 2.74-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" />
            </svg>
            <span>GitHub</span>
          </a>
        </div>
      </header>

      <main class="studio">
        <aside class="control-panel" aria-label="编辑工具">
          <div class="panel-intro">
            <span class="eyebrow">AI PHOTO TOOL</span>
            <h1>三步遮住合影中的每张脸</h1>
            <p>先找全人脸，再为较大的脸识别表情。识别不确定时默认使用开心表情。</p>
          </div>

          <section class="tool-section" aria-labelledby="importTitle">
            <div class="section-heading">
              <span class="step-number">1</span>
              <div>
                <h2 id="importTitle">导入照片</h2>
                <p>支持 JPG、PNG、WebP</p>
              </div>
            </div>
            <label class="button primary upload-button" for="imageInput">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" />
              </svg>
              选择照片
            </label>
          </section>

          <section class="tool-section" aria-labelledby="detectTitle">
            <div class="section-heading">
              <span class="step-number">2</span>
              <div>
                <h2 id="detectTitle">自动识别</h2>
                <p>最多检测 80 张脸</p>
              </div>
            </div>
            <button id="recognizeButton" class="button detect-button" type="button" disabled>
              <svg class="button-icon detect-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" />
                <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none" />
                <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none" />
                <path d="M8.5 14.5c1.7 1.8 5.3 1.8 7 0" />
              </svg>
              <span id="recognizeLabel">识别并贴图</span>
            </button>
            <label class="field-label" for="processingMode">自动模式</label>
            <select id="processingMode" class="select-control">
              <option value="auto-expression">自动表情（前 6 张）</option>
              <option value="all-happy">全部开心</option>
              <option value="random">随机表情</option>
            </select>
            <div class="pipeline-note" aria-label="识别流程">
              <span>人脸检测</span>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 6 6-6 6" /></svg>
              <span>前 6 张识别表情</span>
            </div>
            <div id="scanStats" class="scan-stats" aria-live="polite">尚未检测</div>
          </section>

          <section class="tool-section" aria-labelledby="emojiTitle">
            <div class="section-heading">
              <span class="step-number">3</span>
              <div>
                <h2 id="emojiTitle">修正表情</h2>
                <p id="selectionHint">先在画布中选中一个贴图</p>
              </div>
            </div>
            <div class="mask-picker" role="group" aria-label="选择遮挡方式">
              <button class="mask-option is-active" type="button" data-mask-type="emoji" aria-label="Emoji 遮挡">Emoji</button>
              <button class="mask-option" type="button" data-mask-type="blur" aria-label="模糊遮挡">模糊</button>
              <button class="mask-option" type="button" data-mask-type="pixelate" aria-label="像素遮挡">像素</button>
              <button class="mask-option" type="button" data-mask-type="solid" aria-label="纯色遮挡">纯色</button>
            </div>
            <div id="unicodePicker" class="unicode-picker" role="group" aria-label="修改选中贴图的表情">
              <button class="emoji-option" type="button" data-expression="happy" aria-label="开心" title="开心">😄</button>
              <button class="emoji-option" type="button" data-expression="sad" aria-label="悲伤" title="悲伤">😢</button>
              <button class="emoji-option" type="button" data-expression="angry" aria-label="生气" title="生气">😠</button>
              <button class="emoji-option" type="button" data-expression="surprised" aria-label="惊讶" title="惊讶">😮</button>
              <button class="emoji-option" type="button" data-expression="neutral" aria-label="中性" title="中性">😐</button>
            </div>
          </section>

          <div class="panel-actions">
            <button id="repairButton" class="button repair-button" type="button" disabled>
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4h6M4 4v6M20 20h-6M20 20v-6M20 4h-6M20 4v6M4 20h6M4 20v-6" />
              </svg>
              <span id="repairLabel">补脸</span>
            </button>
            <button id="exportButton" class="button export-button" type="button" disabled>
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 4v12m0 0 4.5-4.5M12 16l-4.5-4.5M5 19v1h14v-1" />
              </svg>
              导出 PNG
            </button>
            <button id="clearButton" class="button ghost" type="button" disabled>清空贴图</button>
          </div>
        </aside>

        <section class="workspace" aria-label="图片编辑区域">
          <div class="canvas-toolbar">
            <div class="status-wrap">
              <span class="status-dot" aria-hidden="true"></span>
              <div id="statusText" class="status" aria-live="polite">未导入图片</div>
            </div>
            <div class="zoom-controls" aria-label="视图缩放">
              <button id="zoomOutButton" class="button icon-button" type="button" disabled aria-label="缩小" title="缩小">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
              </button>
              <button id="resetViewButton" class="button fit-button" type="button" disabled>适配</button>
              <button id="zoomInButton" class="button icon-button" type="button" disabled aria-label="放大" title="放大">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
              </button>
            </div>
          </div>

          <div id="canvasStage" class="canvas-stage">
            <canvas id="editorCanvas"></canvas>
            <div id="emptyState" class="empty-state">
              <div class="empty-content">
                <div class="empty-visual" aria-hidden="true">
                  <svg viewBox="0 0 96 76">
                    <rect x="8" y="10" width="80" height="56" rx="10" />
                    <circle cx="35" cy="35" r="15" />
                    <circle cx="31" cy="32" r="1.6" />
                    <circle cx="39" cy="32" r="1.6" />
                    <path d="M29 38c2 4 10 4 12 0" />
                    <path d="m52 51 10-12 17 20" />
                  </svg>
                </div>
                <div>
                  <strong>拖一张合影到这里</strong>
                  <span>或从电脑中选择照片，识别过程不会上传图片</span>
                </div>
                <label class="button primary large" for="imageInput">选择照片</label>
              </div>
            </div>
          </div>

          <div class="canvas-footer" aria-label="编辑提示">
            <span><kbd>拖动</kbd> 移动贴图</span>
            <span><kbd>边框</kbd> 调整大小</span>
            <span><kbd>滚轮</kbd> 缩放画布</span>
            <span><kbd>右键</kbd> 新增贴图</span>
            <span><kbd>Delete</kbd> 删除选中项</span>
          </div>
        </section>
      </main>

      <input id="imageInput" class="file-input" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif" />
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
