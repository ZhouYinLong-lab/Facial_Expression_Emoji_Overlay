<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>表情 Emoji 图片编辑器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div class="brand">
          <span class="brand-mark">✦</span>
          <span>表情 Emoji 编辑器</span>
        </div>
        <div class="actions">
          <label class="button primary" for="imageInput">导入图片</label>
          <button id="recognizeButton" class="button detect-button" type="button" disabled>
            <span class="button-icon" aria-hidden="true">✦</span>
            识别并贴图
          </button>
          <div class="unicode-picker" role="group" aria-label="修改选中贴图的表情">
            <span class="style-label">Unicode</span>
            <button class="emoji-option" type="button" data-expression="happy" aria-label="开心">😄</button>
            <button class="emoji-option" type="button" data-expression="sad" aria-label="悲伤">😢</button>
            <button class="emoji-option" type="button" data-expression="angry" aria-label="生气">😠</button>
            <button class="emoji-option" type="button" data-expression="surprised" aria-label="惊讶">😮</button>
            <button class="emoji-option" type="button" data-expression="neutral" aria-label="中性">😐</button>
          </div>
          <div class="zoom-controls" aria-label="视图缩放">
            <button id="zoomOutButton" class="button icon-button" type="button" disabled aria-label="缩小" title="缩小">−</button>
            <button id="resetViewButton" class="button fit-button" type="button" disabled>适配</button>
            <button id="zoomInButton" class="button icon-button" type="button" disabled aria-label="放大" title="放大">+</button>
          </div>
          <button id="exportButton" class="button" type="button" disabled>导出 PNG</button>
          <button id="clearButton" class="button ghost" type="button" disabled>清空</button>
        </div>
        <div id="statusText" class="status" aria-live="polite">未导入图片</div>
      </header>

      <section class="workspace" aria-label="图片编辑区域">
        <div id="canvasStage" class="canvas-stage">
          <canvas id="editorCanvas"></canvas>
          <div id="emptyState" class="empty-state">
            <div class="empty-content">
              <div class="empty-icon" aria-hidden="true">✦</div>
              <strong>把照片变成有表情的贴纸</strong>
              <span>导入图片后，点击“识别并贴图”自动覆盖人脸</span>
              <label class="button primary large" for="imageInput">导入图片</label>
            </div>
          </div>
        </div>
      </section>
      <input id="imageInput" class="file-input" type="file" accept="image/*" />
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
